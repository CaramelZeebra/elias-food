<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elias Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- LEFT: channel rail -->
    <nav class="rail" id="rail" aria-label="Recipe categories">
      <div class="rail-brand">
        <span class="rail-brand-name">Elias Food</span>
      </div>
      <div class="rail-search-wrap">
        <input id="rail-search" class="rail-search" type="text" placeholder="Fuzzy-find a channel…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="rail-section-label">Channels</div>
      <ul class="rail-list" id="rail-list"><!-- injected --></ul>
      <div class="rail-footer">
        <span id="recipe-count">0</span> recipes on file
      </div>
    </nav>

    <!-- MIDDLE: list pane -->
    <section class="list-pane" id="list-pane">
      <div class="list-pane-sticky">
        <div class="ticket">
          <div class="ticket-perf" aria-hidden="true"></div>
          <input id="search" class="ticket-input" type="text" placeholder="Fuzzy-find a recipe… (try 'crb' or 'grn cry')" autocomplete="off" spellcheck="false" />
          <span class="ticket-hint" id="result-count">3</span>
        </div>

        <div class="filter-row" id="filter-row"><!-- injected quick filters --></div>
      </div>

      <ol class="recipe-list" id="recipe-list" aria-label="Recipes">
        <li class="list-loading">Loading recipes…</li>
      </ol>
    </section>

    <!-- RIGHT: detail pane -->
    <section class="detail-pane" id="detail-pane">
      <button class="back-btn" id="back-btn" type="button" aria-label="Back to list">← Back to list</button>
      <div class="detail-empty" id="detail-empty">
        <div class="detail-empty-mark">◇</div>
        <p>Select a recipe from the list to open its card.</p>
        <p class="detail-empty-hint">Press <kbd>/</kbd> to search, <kbd>↑</kbd><kbd>↓</kbd> to move, <kbd>↵</kbd> to open.</p>
      </div>
      <article class="recipe-card" id="recipe-card" hidden><!-- injected --></article>
    </section>

  </div>

  <script src="js/fuzzy.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
